<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aikulbGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99855" />
      <stop offset="50%" stop-color="#E8BD85" />
      <stop offset="100%" stop-color="#FCE5BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Background Container -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#070A0F" />
  <!-- Subtle Gold Border (No Green) -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="url(#aikulbGoldGrad)" stroke-width="2.5" opacity="0.8" />
  <!-- AK Trishul Emblem in Gold -->
  <g filter="url(#glow)">
    <!-- Center Prong -->
    <path d="M50 22 L55 33 H45 Z" fill="#E8BD85" />
    <path d="M50 33 V62" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Left Prong -->
    <path d="M34 29 L39 37 H30 Z" fill="#E8BD85" />
    <path d="M34 37 V47 C34 54 42 54 42 54" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Right Prong -->
    <path d="M66 29 L70 37 L61 37 Z" fill="#E8BD85" />
    <path d="M66 37 V47 C66 54 58 54 58 54" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Crossbar Knot -->
    <line x1="38" y1="54" x2="62" y2="54" stroke="#E8BD85" stroke-width="4" stroke-linecap="round" />
    <!-- Base Indicator -->
    <circle cx="50" cy="69" r="3.5" fill="#E8BD85" />
  </g>
</svg>
