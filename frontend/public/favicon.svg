<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aikulbGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00DC82" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Rounded Frame with Gradient -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#aikulbGrad)" />
  <!-- Inner Dark Box -->
  <rect x="11" y="11" width="78" height="78" rx="20" fill="#070A0F" />
  <!-- AK Trident Emblem -->
  <g filter="url(#glow)">
    <!-- Center Prong -->
    <path d="M50 24 L55 35 H45 Z" fill="#00DC82" />
    <path d="M50 35 V62" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Left Prong -->
    <path d="M34 31 L39 39 H30 Z" fill="#00DC82" />
    <path d="M34 39 V49 C34 56 42 56 42 56" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Right Prong -->
    <path d="M66 31 L70 39 L61 39 Z" fill="#00DC82" />
    <path d="M66 39 V49 C66 56 58 56 58 56" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Crossbar Knot -->
    <line x1="38" y1="56" x2="62" y2="56" stroke="#00DC82" stroke-width="4" stroke-linecap="round" />
    <!-- Base Indicator -->
    <circle cx="50" cy="71" r="3.5" fill="#00DC82" />
  </g>
</svg>
